name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual re-run (e.g. a staging retry) without re-tagging

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC): no token, no 2FA in CI

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOTE: no registry-url here. setup-node would write an .npmrc with a
      # placeholder NODE_AUTH_TOKEN, and a configured token (even a bogus one)
      # preempts npm's OIDC trusted-publishing exchange (E401).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm >= 11.5.1 (required for trusted publishing)
        run: npm install -g npm@latest && npm --version
      - name: OIDC availability check
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC available: id-token request URL is set"
          else
            echo "OIDC NOT available: id-token permission missing from job"
          fi
      - name: tag must match package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package v$v"; exit 1; }
      - run: npm ci
      - name: release gate (unit tests, size budget, browser suite)
        run: |
          npm test
          npm run size
          npx playwright install --with-deps chromium firefox
          FG_BROWSERS=chromium,firefox npm run test:browser
      - name: what will ship
        run: npm pack --dry-run
      - name: stage (OIDC; a maintainer approves with 2FA to go live)
        # on failure, surface the OIDC token-exchange response from npm's
        # debug log; a rejected exchange otherwise falls back to a bare
        # ENEEDAUTH with no explanation
        run: |
          npm stage publish --loglevel verbose || {
            grep -iE "oidc|exchange|token|401|403" /home/runner/.npm/_logs/*.log | tail -40
            exit 1
          }
